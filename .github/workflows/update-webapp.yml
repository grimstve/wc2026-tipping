name: update-azure-static-webapp

on:
  push:
    branches:
      - main

jobs:
  deploy-to-azure-static-webapp:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate config.js from secrets
        run: |
          sed 's|YOUR_PROJECT_ID.supabase.co|${{ secrets.SUPABASE_URL }}|g; s|YOUR_ANON_PUBLIC_KEY|${{ secrets.SUPABASE_ANON }}|g' \
            config.template.js > config.js

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "upload"
          app_location: "/"
          api_location: ""
          output_location: "/"
          skip_app_build: true
